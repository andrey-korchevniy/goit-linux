applications:
  - name: django-app
    namespace: default
    project: default
    source:
      repoURL: https://github.com/REPO_OWNER/REPO_NAME.git
      path: lesson-8-9/charts/django-app
      targetRevision: main
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

repositories: []
repoConfig: {}


