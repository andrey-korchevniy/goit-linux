image:
    repository: '' # set via --set or edit after terraform output ecr_repository_url
    tag: 'latest'
    pullPolicy: IfNotPresent

service:
    type: LoadBalancer
    port: 8000

autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

config:
    # Replace with your real envs from topic 4
    DJANGO_SETTINGS_MODULE: 'config.settings'
    DJANGO_DEBUG: 'false'
    POSTGRES_HOST: 'db'
    POSTGRES_PORT: '5432'
    POSTGRES_USER: 'django_user'
    POSTGRES_DB: 'django_db'
    POSTGRES_PASSWORD: 'change_me'
